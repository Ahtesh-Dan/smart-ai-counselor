name: CI/CD Pipeline to GCP

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Server and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            git fetch --all
            git reset --hard origin/main
            sudo docker stop ai-counselor || true
            sudo docker rm ai-counselor || true
            sudo docker build -t ai-counselor .
            sudo docker run -d -p 7860:7860 --env-file .env --name ai-counselor ai-counselor
